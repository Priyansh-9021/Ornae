services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jewellery_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  chatbot:
    build: ./chatbot
    env_file:
      - ./chatbot/.env
    ports:
      - "8000:8000"
    depends_on:
      - backend

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
